[versions]

# Build Tools
agp = "8.10.1"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"

# SDK
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# AndroidX
coreKtx = "1.17.0"
lifecycle = "2.9.3"
activityCompose = "1.10.1"

# Compose
composeBom = "2025.08.00"
navigation = "2.9.3"

# Coroutines
coroutines = "1.10.2"

# Dependency Injection
hilt = "2.57.1"
hiltNavigation = "1.3.0"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"

# Database
room = "2.7.2"

# Image Loading
coil = "2.7.0"

# DataStore
datastore = "1.1.7"

# Logging
timber = "5.0.1"

# Serialization
serialization = "1.9.0"

# Testing
junit4 = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
mockito = "5.18.0"
mockitoKotlin = "6.0.0"
mockWebServer = "4.12.0"
turbine = "1.2.1"

# Debug
leakcanary = "2.14"

# Code Quality
detekt = "1.23.8"
spotless = "7.2.1"
material = "1.12.0"

[libraries]

# ---------- AndroidX ----------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# ---------- Compose ----------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-material3 = { module = "androidx.compose.material3:material3" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# ---------- Navigation ----------
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# ---------- Coroutines ----------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# ---------- Hilt ----------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

# ---------- Retrofit ----------
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

# ---------- OkHttp ----------
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockWebServer" }

# ---------- Room ----------
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# ---------- Coil ----------
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# ---------- DataStore ----------
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ---------- Timber ----------
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# ---------- LeakCanary ----------
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# ---------- Testing ----------
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# ---------- Serialization ----------
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

android-library = { id = "com.android.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

